<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1e4d2b">
<meta name="color-scheme" content="light dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Inventory">
<title>Inventory</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Login -->
<section id="login" class="screen">
  <div class="lang-pick" id="loginLang"></div>
  <div class="login-top">
    <span class="mark mark-arba" aria-hidden="true"></span>
    <h1>Inventory</h1>
    <p>Arba Hospitality</p>
  </div>
  <div class="auth">
    <div id="authMsg" class="auth-msg" role="alert"></div>

    <form id="a-login" onsubmit="event.preventDefault(); doLogin()">
      <label data-t="email"></label><input id="lEmail" type="email" autocomplete="username" autocapitalize="off" inputmode="email" dir="ltr">
      <label data-t="password"></label><input id="lPass" type="password" autocomplete="current-password" dir="ltr">
      <button class="btn full" id="lBtn" type="submit" data-t="login"></button>
      <button class="link" type="button" onclick="$('fEmail').value=$('lEmail').value; showAuth('forgot')" data-t="forgot"></button>
      <div class="auth-alt"><span data-t="newTeam"></span> <button class="link" type="button" onclick="$('rEmail').value=$('lEmail').value; showAuth('register')" data-t="createAccount"></button></div>
    </form>

    <form id="a-register" class="hidden" onsubmit="event.preventDefault(); doRegister()">
      <h2 data-t="createTitle"></h2>
      <p class="muted small" data-t="createHint"></p>
      <label data-t="yourName"></label><input id="rName" autocomplete="name">
      <label data-t="email"></label><input id="rEmail" type="email" autocomplete="username" autocapitalize="off" inputmode="email" dir="ltr">
      <label data-t="pwLabel"></label><input id="rPass" type="password" autocomplete="new-password" oninput="pwHint(this)" dir="ltr"><div class="pw-hint" id="rPassHint"><div class="pw-bar"><span></span></div><small></small></div>
      <label data-t="pwAgain"></label><input id="rPass2" type="password" autocomplete="new-password" dir="ltr">
      <button class="btn full" id="rBtn" type="submit" data-t="sendRequest"></button>
      <button class="link" type="button" onclick="showAuth('login')" data-t="backLogin"></button>
    </form>

    <form id="a-forgot" class="hidden" onsubmit="event.preventDefault(); doForgot()">
      <h2 data-t="forgotTitle"></h2>
      <p class="muted small" data-t="forgotHint"></p>
      <label data-t="email"></label><input id="fEmail" type="email" autocomplete="username" autocapitalize="off" inputmode="email" dir="ltr">
      <button class="btn full" id="fBtn" type="submit" data-t="sendLink"></button>
      <button class="link" type="button" onclick="showAuth('login')" data-t="backLogin"></button>
    </form>

    <form id="a-reset" class="hidden" onsubmit="event.preventDefault(); doReset()">
      <h2 data-t="chooseTitle"></h2>
      <p class="muted small" id="xEmail" dir="ltr"></p>
      <label data-t="newPw"></label><input id="xPass" type="password" autocomplete="new-password" oninput="pwHint(this)" dir="ltr"><div class="pw-hint" id="xPassHint"><div class="pw-bar"><span></span></div><small></small></div>
      <label data-t="newPwAgain"></label><input id="xPass2" type="password" autocomplete="new-password" dir="ltr">
      <button class="btn full" id="xBtn" type="submit" data-t="savePw"></button>
      <button class="link" type="button" onclick="showAuth('login')" data-t="backLogin"></button>
    </form>

    <div id="a-done" class="hidden">
      <div class="done-icon">✉️</div>
      <p id="doneText"></p>
      <button class="btn full" type="button" onclick="showAuth('login')" data-t="backToLogin"></button>
    </div>
  </div>
</section>

<!-- Main -->
<section id="main" class="screen hidden">
  <header>
    <div class="top-row">
      <button class="inv-switch" id="invSwitch" onclick="openInvPicker()">
        <span class="mark" id="hdrLogo" aria-hidden="true"></span>
        <span class="inv-names"><b id="restName"></b><small id="invType"></small></span>
        <span class="caret" id="invCaret">▾</span>
      </button>
      <button class="icon-btn" onclick="openMenu()" aria-label="Menu">☰</button>
    </div>
    <div class="sub"><span id="monthLabel"></span> · <span id="saveStatus"></span></div>
  </header>

  <div class="bar">
    <div class="row">
      <input id="search" type="search" data-tp="search" oninput="render()">
      <button class="step-btn" id="stepBtn" onclick="toggleStep()" aria-label="+ / −">±1</button>
      <select id="filter" onchange="render()">
        <option value="all" data-t="all"></option>
        <option value="todo" data-t="todo"></option>
        <option value="done" data-t="doneF"></option>
      </select>
    </div>
    <div class="chips" id="chips"></div>
    <div class="progress"><div id="prog"></div></div>
  </div>

  <main id="list"></main>

  <button class="next-btn" id="nextBtn" onclick="nextUncounted()">↓ <span data-t="next"></span></button>

  <footer>
    <div class="tot"><span id="totLine"></span><br><span id="counted"></span></div>
    <button class="btn" onclick="openFinish()" data-t="finish"></button>
  </footer>
</section>

<!-- Bottom sheets -->
<div class="sheet" id="invSheet" onclick="closeSheet(event,this)">
  <div class="panel"><h3 data-t="chooseInv"></h3><div id="invList"></div></div>
</div>

<div class="sheet" id="menuSheet" onclick="closeSheet(event,this)">
  <div class="panel">
    <h3 id="menuName"></h3>
    <div class="muted" id="menuRole"></div>
    <div class="menu-list">
      <button class="mgr-only" onclick="closeAll(); openEdit(null)" data-t="addProduct"></button>
      <button class="mgr-only" onclick="resetCounts()" data-t="newMonth"></button>
      <button class="owner-only" onclick="openTeam()" data-t="team"></button>
      <button onclick="refresh(true)" data-t="refresh"></button>
      <button onclick="openChangePass()" data-t="changePw"></button>
      <div class="menu-lang"><span data-t="language"></span><div class="lang-pick" id="menuLang"></div></div>
      <button class="danger" onclick="logout()" data-t="logout"></button>
    </div>
  </div>
</div>

<div class="sheet" id="finishSheet" onclick="closeSheet(event,this)">
  <div class="panel tall">
    <h3 data-t="finishTitle"></h3>
    <label data-t="month"></label>
    <select id="monthSel"></select>
    <div class="stats">
      <div class="stat"><span data-t="inventory"></span><b id="fInv"></b></div>
      <div class="stat"><span data-t="productsCounted"></span><b id="fCounted"></b></div>
      <div class="stat" id="fBottlesRow"><span data-t="totalBottles"></span><b id="fBottles"></b></div>
      <div class="stat"><span data-t="totalValue"></span><b id="fValue"></b></div>
      <div class="stat"><span data-t="countedBy"></span><b id="fBy"></b></div>
    </div>
    <div id="fMissing"></div>
    <button class="btn full" id="sendBtn" onclick="send()" data-t="sendOffice"></button>
    <button class="btn light full" onclick="downloadXlsx()" data-t="downloadExcel"></button>
    <button class="btn light full" onclick="closeAll()" data-t="backCounting"></button>
  </div>
</div>

<div class="sheet" id="editSheet" onclick="closeSheet(event,this)">
  <div class="panel">
    <h3 id="editTitle"></h3>
    <label data-t="productName"></label><input id="eName">
    <label data-t="category"></label><select id="eCat"></select>
    <label data-t="supplier"></label><input id="eSup" list="supList"><datalist id="supList"></datalist>
    <div id="eUnitWrap"><label data-t="unit"></label><select id="eUnit" onchange="drawPriceLabel()"></select></div>
    <label id="ePriceLbl"></label><input id="ePrice" inputmode="decimal" dir="ltr">
    <button class="btn full" id="eSave" onclick="saveEdit()" data-t="save"></button>
    <button class="btn light full danger-text" id="removeBtn" onclick="removeProduct()" data-t="removeProduct"></button>
    <p class="muted small" id="removeHint" data-t="removeHint"></p>
  </div>
</div>

<div class="sheet" id="codeSheet" onclick="closeSheet(event,this)">
  <div class="panel">
    <h3 data-t="changePwTitle"></h3>
    <label data-t="currentPw"></label><input id="cCur" type="password" autocomplete="current-password" dir="ltr">
    <label data-t="newPw"></label><input id="cNew" type="password" autocomplete="new-password" oninput="pwHint(this)" dir="ltr"><div class="pw-hint" id="cNewHint"><div class="pw-bar"><span></span></div><small></small></div>
    <label data-t="newPwAgain"></label><input id="cNew2" type="password" autocomplete="new-password" dir="ltr">
    <button class="btn full" id="cBtn" onclick="changePass()" data-t="saveNewPw"></button>
    <button class="btn light full" onclick="closeAll()" data-t="cancel"></button>
  </div>
</div>

<div class="sheet" id="teamSheet" onclick="closeSheet(event,this)">
  <div class="panel tall">
    <h3 data-t="teamTitle"></h3>
    <div id="teamList" class="team-list"></div>
    <button class="btn full" onclick="shareInvite()" data-t="shareLink"></button>
    <button class="btn light full" onclick="closeAll()" data-t="close"></button>
  </div>
</div>

<div class="sheet" id="memberSheet" onclick="closeSheet(event,this)">
  <div class="panel tall">
    <h3 id="mTitle"></h3>
    <div class="muted small" id="mEmail" dir="ltr"></div>
    <p class="muted small" id="mHint"></p>
    <div id="mNameWrap"><label data-t="name"></label><input id="mName" autocomplete="off"></div>
    <label class="check"><input type="checkbox" id="mOwner" onchange="ownerToggle()"> <span data-t="ownerCheck"></span></label>
    <div id="mRoles"></div>
    <button class="btn full" id="mSave" onclick="saveMember()"></button>
    <button class="btn light full" id="mReset" onclick="resetMember()"></button>
    <button class="btn light full danger-text" id="mBlock" onclick="blockMember()"></button>
    <button class="btn light full danger-text" id="mRemove" onclick="removeMember()"></button>
    <button class="btn light full" onclick="openTeam()" data-t="back"></button>
  </div>
</div>

<div class="toast" id="toast"></div>
<div class="busy hidden" id="busy"><div class="spinner"></div></div>

<script src="config.js"></script>
<script src="i18n.js"></script>
<script src="app.js"></script>
</body>
</html>
